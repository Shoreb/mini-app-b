<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Generador de contraseñas</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f3f5fa;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 1.5rem;
      }

      main {
        box-sizing: border-box;
        width: min(100%, 30rem);
        padding: 2rem;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 1rem 2.5rem #17203318;
      }

      h1 {
        margin-top: 0;
      }

      form,
      .acciones {
        display: grid;
        gap: 1rem;
      }

      label {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      label.longitud {
        display: grid;
      }

      input[type="number"],
      input[type="text"],
      button {
        box-sizing: border-box;
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #c8ceda;
        border-radius: 0.5rem;
        font: inherit;
      }

      button {
        border: 0;
        color: white;
        background: #3156c8;
        cursor: pointer;
      }

      button.secondary {
        color: #24314f;
        background: #e8ecf5;
      }

      #estado {
        min-height: 1.5em;
      }

      #indicador-fuerza {
        display: inline-block;
        margin-bottom: 0;
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        font-weight: 700;
      }

      #indicador-fuerza.fuerza-debil {
        color: #8b1e1e;
        background: #fde2e2;
      }

      #indicador-fuerza.fuerza-media {
        color: #6b4d00;
        background: #fff1bf;
      }

      #indicador-fuerza.fuerza-fuerte {
        color: #155d32;
        background: #d9f4e3;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Generador de contraseñas</h1>
      <form id="formulario">
        <label class="longitud" for="longitud">
          Longitud (8–64)
          <input id="longitud" name="longitud" type="number" min="8" max="64" value="12" required>
        </label>
        <label for="numeros">
          <input id="numeros" name="numeros" type="checkbox" checked>
          Incluir números
        </label>
        <label for="simbolos">
          <input id="simbolos" name="simbolos" type="checkbox">
          Incluir símbolos (!@#$%&amp;*?-_)
        </label>
        <div class="acciones">
          <button type="submit">Generar contraseña</button>
          <input id="contrasena" type="text" aria-label="Contraseña generada" readonly>
          <p id="indicador-fuerza" aria-live="polite">Fuerza: aún no generada</p>
          <button id="copiar" class="secondary" type="button">Copiar contraseña</button>
        </div>
      </form>
      <p id="estado" role="status" aria-live="polite"></p>
    </main>
    <script>
      const formulario = document.querySelector("#formulario");
      const campoContrasena = document.querySelector("#contrasena");
      const estado = document.querySelector("#estado");
      const indicadorFuerza = document.querySelector("#indicador-fuerza");
      const clasesFuerza = {
        débil: "fuerza-debil",
        media: "fuerza-media",
        fuerte: "fuerza-fuerte",
      };

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        estado.textContent = "";

        const parametros = new URLSearchParams({
          longitud: document.querySelector("#longitud").value,
          numeros: String(document.querySelector("#numeros").checked),
          simbolos: String(document.querySelector("#simbolos").checked),
        });

        try {
          const respuesta = await fetch(`/api/contrasena?${parametros}`);
          if (!respuesta.ok) {
            throw new Error("No se pudo generar la contraseña.");
          }
          const datos = await respuesta.json();
          const claseFuerza = clasesFuerza[datos.fuerza];
          if (!claseFuerza) {
            throw new Error("La respuesta contiene una fuerza de contraseña no válida.");
          }
          campoContrasena.value = datos.contrasena;
          indicadorFuerza.textContent = `Fuerza: ${datos.fuerza}`;
          indicadorFuerza.className = claseFuerza;
        } catch (error) {
          estado.textContent = error.message;
        }
      });

      document.querySelector("#copiar").addEventListener("click", async () => {
        if (!campoContrasena.value) {
          estado.textContent = "Genera una contraseña antes de copiarla.";
          return;
        }

        try {
          await navigator.clipboard.writeText(campoContrasena.value);
          estado.textContent = "Contraseña copiada.";
        } catch (error) {
          estado.textContent = "No se pudo copiar la contraseña.";
        }
      });
    </script>
  </body>
</html>
